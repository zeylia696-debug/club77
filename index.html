<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Club 7-7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light}
/* Layout : carnet de direction — rail de sections à gauche (onglets défilants sur mobile), registre à droite. Velours prune + laiton. */
:root{
  --bg:#f5f0f3; --surface:#fffcfd; --sunk:#efe7ec; --ink:#251a23; --muted:#77656f; --line:#e3d6dd;
  --accent:#86193f; --accent-ink:#fff6f9; --brass:#9b6e1f;
  --ok:#2c7650; --ok-bg:#e3f1e8; --warn:#9a5a00; --warn-bg:#fbefd9; --bad:#ab2a1f; --bad-bg:#f9e2df;
  --shadow:0 18px 50px -20px rgba(60,20,40,.35);
  --f-display:"Bodoni Moda",Didot,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150e14; --surface:#1f161e; --sunk:#271c26; --ink:#f2e7ed; --muted:#a8959f; --line:#382a35;
  --accent:#e65b90; --accent-ink:#1d0912; --brass:#d9ae5e;
  --ok:#74d39c; --ok-bg:#1d3326; --warn:#f2b558; --warn-bg:#3a2a12; --bad:#f48a80; --bad-bg:#3d1c1a;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150e14; --surface:#1f161e; --sunk:#271c26; --ink:#f2e7ed; --muted:#a8959f; --line:#382a35;
  --accent:#e65b90; --accent-ink:#1d0912; --brass:#d9ae5e;
  --ok:#74d39c; --ok-bg:#1d3326; --warn:#f2b558; --warn-bg:#3a2a12; --bad:#f48a80; --bad-bg:#3d1c1a;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--surface)}
.mark{display:flex;flex-direction:column;gap:2px;padding-left:10px}
.mark b{font-family:var(--f-display);font-size:42px;line-height:1;font-weight:700;letter-spacing:-.01em}
.mark b i{color:var(--accent);font-style:italic;font-weight:500}
.mark span{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .n{font-family:var(--f-mono);font-size:12px;opacity:.85}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);padding-left:10px}
main{min-width:0;padding-block:32px 80px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(30px,4vw,40px);line-height:1.1;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.note{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:16px}

/* registre */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.row .sub span{overflow-wrap:anywhere}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-checked="true"]::after{content:"";width:10px;height:6px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;line-height:1;padding:0}
.step button:hover{border-color:var(--accent);color:var(--accent)}
.step .num{min-width:2ch;text-align:center;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brass);margin-inline:7px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.acc{background:var(--accent);color:var(--accent-ink)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.group{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--brass);font-weight:700;padding:14px 16px 6px;background:var(--sunk);border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong{font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink)}
.total{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk);font-weight:600}

/* aperçu */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px}
.tile{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:500}
.tile .s{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cols h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0 0 10px}

/* formulaire */
.scrim{position:fixed;inset:0;background:rgba(20,8,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.sheet{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;margin-top:4vh}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:26px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:84px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.actions .spacer{flex:1}
.err{color:var(--bad);font-size:13px}
.login{padding:0 16px;display:flex;justify-content:center}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .mark{padding-left:0;flex:none}.mark b{font-size:26px}.mark span{display:none}
  nav{flex-direction:row;gap:4px}
  .tab{white-space:nowrap;padding:7px 11px}
  .rail .foot{display:none}
  main{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .row{grid-template-columns:auto minmax(0,1fr);}
  .row .right{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
</style>
</head>
<body>

<div class="app" hidden>
  <aside class="rail">
    <div class="mark"><b>7<i>-</i>7</b><span>Direction · Patronne &amp; manager</span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="foot"><div id="sync">Connexion au registre…</div><div id="who" style="margin-top:4px;overflow-wrap:anywhere"></div><button class="chip" id="logout" style="margin-top:8px">Se déconnecter</button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim" hidden></div>

<section id="login" class="login" hidden>
  <form id="lform" class="sheet" style="margin-top:12vh">
    <div class="mark" style="padding:0"><b>7<i>-</i>7</b><span>Direction · Patronne &amp; manager</span></div>
    <div class="field"><label for="lmail">E-mail</label><input id="lmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lpass">Mot de passe</label><input id="lpass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr" hidden></div>
    <div class="actions"><button class="btn primary" id="lbtn">Se connecter</button></div>
  </form>
</section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG);

const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const S={
  apercu:{label:"Aperçu"},
  todos:{label:"To-do",title:"To-do list",intro:"Ce qu'il reste à faire, et qui s'en charge.",one:"une tâche",check:true,
    fields:[{k:"titre",l:"Tâche",t:"text",req:1,wide:1},{k:"qui",l:"Qui s'en charge",t:"select",o:["Patronne","Manager","Les deux"]},{k:"priorite",l:"Priorité",t:"select",o:["Normale","Haute","Basse"]},{k:"echeance",l:"Pour le",t:"date"},{k:"notes",l:"Notes",t:"area",wide:1}]},
  choix:{label:"Choix à venir",title:"Choix à venir",intro:"Les décisions à prendre ensemble, avec les options sur la table.",one:"un choix",
    fields:[{k:"sujet",l:"Sujet",t:"text",req:1,wide:1},{k:"statut",l:"Statut",t:"select",o:["À trancher","Décidé","Abandonné"]},{k:"limite",l:"À décider avant",t:"date"},{k:"options",l:"Options envisagées",t:"area",wide:1},{k:"decision",l:"Décision prise",t:"text",wide:1}]},
  services:{label:"Services",title:"Services",intro:"Le planning de la semaine : qui bosse, quand, à quel poste.",one:"un service",
    fields:[{k:"employe",l:"Employé·e",t:"text",req:1},{k:"poste",l:"Poste",t:"select",o:["Bar","Service salle","Sécurité","Danse","DJ","Accueil","Manager","Autre"]},{k:"jour",l:"Jour",t:"select",o:DAYS},{k:"debut",l:"Début",t:"time"},{k:"fin",l:"Fin",t:"time"},{k:"notes",l:"Notes",t:"text",wide:1}]},
  achats:{label:"Achats",title:"Achats & ingrédients",intro:"La liste de courses du club. Coche quand c'est acheté.",one:"un achat",check:true,
    fields:[{k:"article",l:"Article",t:"text",req:1,wide:1},{k:"categorie",l:"Catégorie",t:"select",o:["Ingrédient","Alcool","Soft","Matériel","Déco","Autre"]},{k:"quantite",l:"Quantité",t:"text"},{k:"prix",l:"Coût estimé ($)",t:"number"},{k:"fournisseur",l:"Où l'acheter",t:"text"}]},
  stock:{label:"Stock",title:"Stock & inventaire",intro:"Ce qu'il y a en réserve et ce qu'il manque. Utilise − et + pour mettre le stock à jour après un service ou un achat.",one:"un ingrédient",
    fields:[{k:"ingredient",l:"Ingrédient",t:"text",req:1},{k:"rayon",l:"Rayon",t:"select",o:["Fruits & légumes","Boissons","Épicerie","Glace","Alcools","Autre"]},{k:"stock",l:"En stock (unités)",t:"number"},{k:"besoin",l:"Besoin (unités)",t:"number"},{k:"lot",l:"Taille du lot au magasin",t:"number"},{k:"prixlot",l:"Prix du lot ($)",t:"number"}]},
  contrats:{label:"Contrats",title:"Contrats",intro:"Contrats à rédiger, à faire signer et déjà en place.",one:"un contrat",
    fields:[{k:"nom",l:"Nom",t:"text",req:1},{k:"type",l:"Type",t:"select",o:["Employé","Partenaire","Fournisseur","Événement","Autre"]},{k:"poste",l:"Poste / objet",t:"text"},{k:"remuneration",l:"Salaire / montant",t:"text"},{k:"statut",l:"Statut",t:"select",o:["À rédiger","À signer","Signé","Terminé"]},{k:"date",l:"Date",t:"date"},{k:"notes",l:"Clauses, notes",t:"area",wide:1}]},
  carte:{label:"Carte & recettes",title:"Carte & recettes",intro:"La carte change chaque mois avec un thème. Recettes, coût de revient et prix de vente.",one:"une recette",
    fields:[{k:"nom",l:"Nom",t:"text",req:1},{k:"categorie",l:"Catégorie",t:"select",o:["Mocktail","Cocktail","Offre","Shot","Soft","Bouteille","Food","Autre"]},{k:"mois",l:"Mois",t:"select",o:["Toute l'année","Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"]},{k:"theme",l:"Thème du mois",t:"text"},{k:"cout",l:"Coût de revient ($)",t:"number"},{k:"prix",l:"Prix de vente ($)",t:"number"},{k:"recette",l:"Ingrédients & préparation",t:"area",wide:1}]},
  reunions:{label:"Réunions",title:"Réunions",intro:"Les réunions à tenir, l'ordre du jour et ce qui en est sorti.",one:"une réunion",check:true,
    fields:[{k:"sujet",l:"Sujet",t:"text",req:1,wide:1},{k:"date",l:"Date",t:"date"},{k:"heure",l:"Heure",t:"time"},{k:"avec",l:"Avec qui",t:"text",wide:1},{k:"ordre",l:"Ordre du jour",t:"area",wide:1},{k:"cr",l:"Compte rendu",t:"area",wide:1}]}
};
const KEYS=Object.keys(S).filter(k=>k!=="apercu");
const data={};KEYS.forEach(k=>data[k]=[]);
let db=null,canWrite=true,view="apercu",filter="tout",loaded=false,stale=false;
try{const h=location.hash.slice(1);if(S[h])view=h}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
const money=n=>(n===""||n==null||isNaN(n))?"—":"$"+Number(n).toLocaleString("fr-FR",{maximumFractionDigits:2});
const late=r=>r.echeance&&!r.done&&r.echeance<today();
const manque=r=>Math.max(0,(Number(r.besoin)||0)-(Number(r.stock)||0));
const lotsA=r=>{const m=manque(r),l=Number(r.lot)||1;return m?Math.ceil(m/l):0};
const coutA=r=>lotsA(r)*(Number(r.prixlot)||0);

function counts(){return{
  todos:data.todos.filter(r=>!r.done).length,
  choix:data.choix.filter(r=>(r.statut||"À trancher")==="À trancher").length,
  services:data.services.length,
  achats:data.achats.filter(r=>!r.done).length,
  contrats:data.contrats.filter(r=>["À rédiger","À signer",undefined,""].includes(r.statut)).length,
  stock:data.stock.filter(r=>manque(r)>0).length,
  carte:data.carte.length,
  reunions:data.reunions.filter(r=>!r.done).length}}

function renderNav(){
  const c=counts();
  $("#nav").innerHTML=Object.entries(S).map(([k,s])=>`<button class="tab" data-go="${k}" aria-current="${k===view}">${s.label}${c[k]?`<span class="n">${c[k]}</span>`:""}</button>`).join("");
}
function go(k){view=k;filter="tout";try{history.replaceState(null,"","#"+k)}catch(e){location.hash=k}render();window.scrollTo(0,0)}

/* ---------- lignes par section ---------- */
const sorters={
  todos:(a,b)=>((!!a.done)-(!!b.done))||((a.echeance||"9")>(b.echeance||"9")?1:-1)||rank(a.priorite)-rank(b.priorite),
  choix:(a,b)=>((a.statut||"À trancher")==="À trancher"?0:1)-((b.statut||"À trancher")==="À trancher"?0:1)||((a.limite||"9")>(b.limite||"9")?1:-1),
  services:(a,b)=>DAYS.indexOf(a.jour||"Lundi")-DAYS.indexOf(b.jour||"Lundi")||(a.debut||"").localeCompare(b.debut||""),
  achats:(a,b)=>((!!a.done)-(!!b.done))||(a.categorie||"").localeCompare(b.categorie||""),
  stock:(a,b)=>(a.rayon||"").localeCompare(b.rayon||"")||((manque(b)>0)-(manque(a)>0))||(a.ingredient||"").localeCompare(b.ingredient||""),
  contrats:(a,b)=>["À rédiger","À signer","Signé","Terminé"].indexOf(a.statut||"À rédiger")-["À rédiger","À signer","Signé","Terminé"].indexOf(b.statut||"À rédiger"),
  carte:(a,b)=>mrank(a.mois)-mrank(b.mois)||(a.theme||"").localeCompare(b.theme||"")||(a.categorie||"").localeCompare(b.categorie||"")||(a.nom||"").localeCompare(b.nom||""),
  reunions:(a,b)=>((!!a.done)-(!!b.done))||((a.date||"9")+(a.heure||"")>(b.date||"9")+(b.heure||"")?1:-1)
};
function rank(p){return p==="Haute"?0:p==="Basse"?2:1}
const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function mrank(m){const i=MOIS.indexOf(m);return i<0?-1:(i-new Date().getMonth()+12)%12}
const curMois=()=>MOIS[new Date().getMonth()];
function rowHTML(k,r){
  if(k==="stock"){const m=manque(r);
    const step=canWrite?`<div class="step"><button data-step="${r.id}:-1" aria-label="Retirer 1">−</button><span class="num">${Number(r.stock)||0}</span><button data-step="${r.id}:1" aria-label="Ajouter 1">+</button></div>`:`<span class="num">${Number(r.stock)||0}</span>`;
    return `<div class="row" data-open="stock:${r.id}" tabindex="0">${step}<div style="min-width:0"><div class="t">${esc(r.ingredient||"Sans nom")}</div><div class="sub"><span>Besoin : ${Number(r.besoin)||0}</span>${r.lot?`<span>Lot de ${esc(r.lot)} à ${money(r.prixlot)}</span>`:""}</div></div><div class="right">${m?`<span class="pill warn">Manque ${m}</span><span class="num">${lotsA(r)} lot${lotsA(r)>1?"s":""} · ${money(coutA(r))}</span>`:`<span class="pill ok">OK</span>`}</div></div>`}
  const chk=S[k].check?`<button class="chk" role="checkbox" aria-checked="${!!r.done}" aria-label="Marquer comme fait" data-toggle="${k}:${r.id}"></button>`:`<span class="dot"></span>`;
  let t="",sub=[],right="";
  if(k==="todos"){t=r.titre;sub=[r.qui,r.echeance&&("Pour le "+fmtD(r.echeance))];
    right=(late(r)?`<span class="pill bad">En retard</span>`:"")+(r.priorite==="Haute"&&!r.done?`<span class="pill warn">Priorité haute</span>`:"")}
  if(k==="choix"){const st=r.statut||"À trancher";t=r.sujet;sub=[r.limite&&("Avant le "+fmtD(r.limite)),st==="Décidé"&&r.decision?("→ "+r.decision):(r.options||"").split("\n")[0]];
    right=`<span class="pill ${st==="Décidé"?"ok":st==="Abandonné"?"":"warn"}">${esc(st)}</span>`}
  if(k==="services"){t=r.employe;sub=[r.poste,r.notes];right=`<span class="num">${esc(r.debut||"--:--")} → ${esc(r.fin||"--:--")}</span>`}
  if(k==="achats"){t=r.article;sub=[r.categorie,r.quantite&&("Qté : "+r.quantite),r.fournisseur];right=`<span class="num">${money(r.prix)}</span>`}
  if(k==="contrats"){const st=r.statut||"À rédiger";t=r.nom;sub=[r.type,r.poste,r.remuneration,r.date&&fmtD(r.date)];
    right=`<span class="pill ${st==="Signé"?"ok":st==="À signer"?"warn":st==="À rédiger"?"acc":""}">${esc(st)}</span>`}
  if(k==="carte"){t=r.nom;sub=[r.categorie,(r.recette||"").split("\n")[0]];
    const c=Number(r.cout),p=Number(r.prix);const m=(r.prix!==""&&r.prix!=null&&r.cout!==""&&r.cout!=null)?p-c:null;
    right=`<span class="num">${money(r.prix)}</span>`+(m!=null?`<span class="pill ${m>0?"ok":"bad"}">Marge ${money(m)}</span>`:"")}
  if(k==="reunions"){t=r.sujet;sub=[r.avec,r.ordre&&r.ordre.split("\n")[0]];
    const past=r.date&&r.date<today()&&!r.done;right=`<span class="num">${r.date?esc(fmtD(r.date)):"Date à fixer"}${r.heure?" · "+esc(r.heure):""}</span>`+(past?`<span class="pill bad">Passée</span>`:"")}
  return `<div class="row ${r.done?"done":""}" data-open="${k}:${r.id}" tabindex="0">${chk}<div style="min-width:0"><div class="t">${esc(t||"Sans titre")}</div><div class="sub">${sub.filter(Boolean).map(s=>`<span>${esc(s)}</span>`).join("")}</div></div><div class="right">${right}</div></div>`;
}
const FILTERS={
  todos:[["tout","Tout"],["afaire","À faire"],["Patronne","Patronne"],["Manager","Manager"],["fait","Fait"]],
  achats:[["tout","Tout"],["afaire","À acheter"],["fait","Acheté"]],
  reunions:[["tout","Toutes"],["afaire","À venir"],["fait","Tenues"]],
  choix:[["tout","Tous"],["afaire","À trancher"],["fait","Décidés"]],
  contrats:[["tout","Tous"],["afaire","En attente"],["fait","Signés"]],
  stock:[["tout","Tout"],["afaire","À racheter"],["fait","En stock"]],
  carte:[["tout","Tout"],["mois","Ce mois-ci"],["Mocktail","Mocktails"],["Cocktail","Cocktails"],["Offre","Offres"]]
};
function applyFilter(k,rows){
  if(filter==="tout")return rows;
  if(k==="stock")return rows.filter(r=>filter==="afaire"?manque(r)>0:manque(r)===0);
  if(k==="carte")return rows.filter(r=>filter==="mois"?(r.mois===curMois()||r.mois==="Toute l'année"):r.categorie===filter);
  if(k==="choix")return rows.filter(r=>filter==="afaire"?(r.statut||"À trancher")==="À trancher":r.statut==="Décidé");
  if(k==="contrats")return rows.filter(r=>filter==="afaire"?["À rédiger","À signer"].includes(r.statut||"À rédiger"):r.statut==="Signé");
  if(filter==="Patronne"||filter==="Manager")return rows.filter(r=>!r.done&&(r.qui===filter||r.qui==="Les deux"));
  return rows.filter(r=>filter==="fait"?r.done:!r.done);
}

function section(k){
  const s=S[k];let rows=applyFilter(k,[...data[k]].sort(sorters[k]));
  let body;
  if(!loaded&&!data[k].length){body=`<div class="list"><div class="empty">Chargement…</div></div>`}
  else if(!data[k].length){body=`<div class="list"><div class="empty"><strong>Rien pour l'instant</strong><span>Ajoute ${s.one} avec le bouton ci-dessus, elle apparaîtra aussi chez l'autre.</span></div></div>`}
  else if(!rows.length){body=`<div class="list"><div class="empty">Rien dans ce filtre.</div></div>`}
  else{
    let html="";
    if(k==="services"){let cur=null;rows.forEach(r=>{const d=r.jour||"Lundi";if(d!==cur){cur=d;html+=`<div class="group">${esc(d)}</div>`}html+=rowHTML(k,r)})}
    else if(k==="carte"){let cur=null;rows.forEach(r=>{const m=r.mois||"Toute l'année";const d=m+(r.theme?" · "+r.theme:"");if(d!==cur){cur=d;html+=`<div class="group">${esc(d)}${m===curMois()?" — ce mois-ci":""}</div>`}html+=rowHTML(k,r)})}
    else if(k==="stock"){let cur=null;rows.forEach(r=>{const d=r.rayon||"Autre";if(d!==cur){cur=d;html+=`<div class="group">${esc(d)}</div>`}html+=rowHTML(k,r)})}
    else html=rows.map(r=>rowHTML(k,r)).join("");
    if(k==="stock"){const t=data.stock.reduce((a,r)=>a+coutA(r),0),n=data.stock.reduce((a,r)=>a+lotsA(r),0);html+=`<div class="total"><span>À racheter : ${n} lot${n>1?"s":""}</span><span class="num">${money(t)}</span></div>`}
    if(k==="achats"){const t=data.achats.filter(r=>!r.done).reduce((a,r)=>a+(Number(r.prix)||0),0);html+=`<div class="total"><span>Reste à acheter</span><span class="num">${money(t)}</span></div>`}
    body=`<div class="list">${html}</div>`;
  }
  const chips=FILTERS[k]?`<div class="chips">${FILTERS[k].map(([v,l])=>`<button class="chip" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join("")}</div>`:"";
  return `<div class="head"><div><h1>${s.title}</h1><p>${s.intro}</p></div>${canWrite?`<button class="btn primary" data-new="${k}">+ Ajouter ${s.one}</button>`:""}</div>${chips}${body}`;
}

function overview(){
  const c=counts();
  const haute=data.todos.filter(r=>!r.done&&(r.priorite==="Haute"||late(r))).sort(sorters.todos);
  const reu=data.reunions.filter(r=>!r.done).sort(sorters.reunions);
  const choix=data.choix.filter(r=>(r.statut||"À trancher")==="À trancher").sort(sorters.choix);
  const reste=data.achats.filter(r=>!r.done).reduce((a,r)=>a+(Number(r.prix)||0),0);
  const next=reu[0];
  const tile=(k,v,lab,s)=>`<button class="tile" data-go="${k}"><span class="k">${lab}</span><span class="v ${k==="achats"?"num":""}" style="${k==="achats"?"font-family:var(--f-mono);font-size:28px":""}">${v}</span><span class="s">${s}</span></button>`;
  const block=(title,k,rows,emptyTxt)=>`<section><h2>${title}</h2><div class="list">${rows.length?rows.slice(0,5).map(r=>rowHTML(k,r)).join(""):`<div class="empty">${emptyTxt}</div>`}</div></section>`;
  return `<div class="head"><div><h1>Le point du jour</h1><p>${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}. Ce qui demande votre attention, à toutes les deux.</p></div></div>
  ${stale?`<div class="note">Le registre ne répond pas encore. Ce qui s'affiche peut ne pas être à jour.</div>`:""}
  <div class="tiles">
    ${tile("todos",c.todos,"Tâches ouvertes",haute.length?haute.length+" urgente"+(haute.length>1?"s":""):"Rien d'urgent")}
    ${tile("choix",c.choix,"Choix à trancher",choix[0]?esc(choix[0].sujet):"Aucun en attente")}
    ${tile("achats",money(reste),"Reste à acheter",c.achats+" article"+(c.achats>1?"s":""))}
    ${tile("stock",c.stock,"Stock à racheter",c.stock?money(data.stock.reduce((a,r)=>a+coutA(r),0))+" à prévoir":"Réserve complète")}
    ${tile("contrats",c.contrats,"Contrats en attente","à rédiger ou à signer")}
    ${tile("reunions",next?(next.date?fmtD(next.date):"—"):"—","Prochaine réunion",next?esc(next.sujet):"Aucune prévue")}
  </div>
  <div class="cols">
    ${block("Urgent","todos",haute,"Aucune tâche urgente ou en retard.")}
    ${block("Réunions à venir","reunions",reu,"Aucune réunion prévue.")}
  </div>`;
}

function render(){renderNav();$("#main").innerHTML=view==="apercu"?overview():section(view)}

/* ---------- formulaire ---------- */
let editing=null;
function openForm(k,id){
  const s=S[k];const r=id?data[k].find(x=>x.id===id):null;if(id&&!r)return;
  editing={k,id};
  const f=s.fields.map(fd=>{const v=r?r[fd.k]??"":(fd.t==="select"?fd.o[0]:"");const fid="f-"+fd.k;let ctl;
    if(fd.t==="select")ctl=`<select id="${fid}" ${canWrite?"":"disabled"}>${fd.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if(fd.t==="area")ctl=`<textarea id="${fid}" ${canWrite?"":"readonly"}>${esc(v)}</textarea>`;
    else ctl=`<input id="${fid}" type="${fd.t}" ${fd.t==="number"?'step="0.01" min="0" inputmode="decimal"':""} value="${esc(v)}" ${canWrite?"":"readonly"}>`;
    return `<div class="field ${fd.wide?"wide":""}"><label for="${fid}">${fd.l}</label>${ctl}</div>`}).join("");
  $("#scrim").innerHTML=`<form class="sheet" id="form" novalidate><h2>${r?"Modifier":"Ajouter"} ${s.one}</h2><div class="fields">${f}</div><div class="err" id="err" hidden></div>
  <div class="actions">${r&&canWrite?`<button type="button" class="btn danger" id="del">Supprimer</button>`:""}<span class="spacer"></span><button type="button" class="btn" id="cancel">${canWrite?"Annuler":"Fermer"}</button>${canWrite?`<button class="btn primary" id="save">Enregistrer</button>`:""}</div></form>`;
  $("#scrim").hidden=false;
  const first=$("#scrim").querySelector("input,select,textarea");first&&first.focus();
}
function closeForm(){$("#scrim").hidden=true;$("#scrim").innerHTML="";editing=null}
async function save(e){
  e.preventDefault();if(!editing||!db)return;
  const{k,id}=editing;const s=S[k];const out={};
  for(const fd of s.fields){let v=$("#f-"+fd.k).value.trim();if(fd.t==="number")v=v===""?"":Number(v.replace(",","."));out[fd.k]=v}
  const reqF=s.fields.find(fd=>fd.req&&!out[fd.k]);
  if(reqF){const er=$("#err");er.textContent=`Le champ « ${reqF.l} » est obligatoire.`;er.hidden=false;return}
  $("#save").disabled=true;
  try{
    if(id){await db.collection(k).doc(id).update(out)}
    else{out.done=false;out.cree=Date.now();await db.collection(k).add(out)}
    closeForm();
  }catch(err){$("#save").disabled=false;const er=$("#err");er.hidden=false;
    er.textContent=err&&err.code==="quota_exceeded"?"Le registre est plein. Supprime d'anciennes entrées puis réessaie.":err&&err.code==="invalid_argument"?"Tu n'as pas le droit de modifier ce panel. Demande l'accès en écriture à la propriétaire.":"L'enregistrement a échoué. Vérifie ta connexion et réessaie."}
}
let armed=false;
async function del(){
  const b=$("#del");if(!armed){armed=true;b.textContent="Confirmer la suppression";b.classList.add("armed");setTimeout(()=>{armed=false;if(b.isConnected){b.textContent="Supprimer";b.classList.remove("armed")}},3500);return}
  armed=false;const{k,id}=editing;try{await db.collection(k).doc(id).delete();closeForm()}catch(e){const er=$("#err");er.hidden=false;er.textContent="La suppression a échoué. Réessaie."}
}
async function toggle(k,id){
  if(!db||!canWrite)return;const r=data[k].find(x=>x.id===id);if(!r)return;
  try{await db.collection(k).doc(id).update({done:!r.done})}catch(e){}
}

const stepTimers={};
function stepStock(id,d){
  if(!db||!canWrite)return;const r=data.stock.find(x=>x.id===id);if(!r)return;
  const v=Math.max(0,(Number(r.stock)||0)+d);
  data.stock=data.stock.map(x=>x.id===id?{...x,stock:v}:x);render();
  clearTimeout(stepTimers[id]);
  stepTimers[id]=setTimeout(()=>{db.collection("stock").doc(id).update({stock:v}).catch(()=>{})},600);
}
/* ---------- événements ---------- */
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-step]");
  if(st){e.stopPropagation();const[id,d]=st.dataset.step.split(":");stepStock(id,Number(d));return}
  const t=e.target.closest("[data-toggle],[data-go],[data-new],[data-filter],[data-open],#cancel,#del");if(!t)return;
  if(t.dataset.toggle){e.stopPropagation();const[k,id]=t.dataset.toggle.split(":");toggle(k,id);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.new){openForm(t.dataset.new);return}
  if(t.dataset.filter){filter=t.dataset.filter;render();return}
  if(t.dataset.open){const[k,id]=t.dataset.open.split(":");openForm(k,id);return}
  if(t.id==="cancel"){closeForm();return}
  if(t.id==="del"){del();return}
});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeForm()});
document.addEventListener("submit",e=>{if(e.target.id==="form")save(e)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&editing)closeForm();
  if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("row")){const[k,id]=e.target.dataset.open.split(":");openForm(k,id)}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(S[h]&&h!==view){view=h;render()}});

/* ---------- données (Firebase) ---------- */
const auth=firebase.auth();
let unsubs=[];
function showLogin(msg){
  $("#login").hidden=false;$(".app").hidden=true;
  if(msg){$("#lerr").textContent=msg;$("#lerr").hidden=false}
}
$("#lform").addEventListener("submit",async e=>{
  e.preventDefault();$("#lerr").hidden=true;$("#lbtn").disabled=true;
  try{await auth.signInWithEmailAndPassword($("#lmail").value.trim(),$("#lpass").value)}
  catch(err){showLogin(err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"||err.code==="auth/user-not-found"?"E-mail ou mot de passe incorrect.":"Connexion impossible. Vérifie ta connexion et réessaie.")}
  $("#lbtn").disabled=false;
});
$("#logout").addEventListener("click",()=>auth.signOut());
async function seedIfEmpty(){
  try{
    const snap=await db.collection("carte").limit(1).get();
    if(!snap.empty)return;
    const seed=await fetch("seed.json").then(r=>r.json());
    let batch=db.batch(),n=0;
    for(const [col,docs] of Object.entries(seed)){
      for(const [id,doc] of Object.entries(docs)){
        batch.set(db.collection(col).doc(id),doc);
        if(++n%400===0){await batch.commit();batch=db.batch()}
      }
    }
    await batch.commit();
  }catch(e){console.warn("seed",e)}
}
auth.onAuthStateChanged(async u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){showLogin();return}
  $("#login").hidden=true;$(".app").hidden=false;
  $("#who").textContent=u.email;
  db=firebase.firestore();canWrite=true;
  render();
  await seedIfEmpty();
  let pending=new Set(KEYS);
  const timer=setTimeout(()=>{if(pending.size){stale=true;$("#sync").textContent="Le registre tarde à répondre…";loaded=true;render()}},10000);
  KEYS.forEach(k=>{
    unsubs.push(db.collection(k).onSnapshot(snap=>{
      data[k]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(pending.has(k)){pending.delete(k);if(!pending.size){clearTimeout(timer);loaded=true;stale=false;$("#sync").textContent="Synchronisé en direct"}}
      if(!editing)render();else renderNav();
    },err=>{pending.delete(k);loaded=true;$("#sync").textContent=err.code==="permission-denied"?"Accès refusé : ce compte n'est pas autorisé.":"Une section n'a pas pu se charger.";render()}));
  });
});
</script>
</body>
